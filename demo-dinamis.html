<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Demo: Statis vs Dinamis</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Arial, sans-serif; max-width: 960px; margin: 0 auto; padding: 24px 16px; color: #1a2233; }
    h1 { font-size: 1.5rem; }
    .note { background: #eef3ff; border: 1px solid #cdddff; border-radius: 10px; padding: 12px 14px; color: #274690; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); margin-top: 20px; }
    .card { border: 1px solid #e2e7f0; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 4px 14px rgba(16,24,40,.05); }
    .card img { width: 100%; height: 150px; object-fit: cover; background: #eef1f6; }
    .card .body { padding: 14px; }
    .badge { display: inline-block; background: #e8eefb; color: #2457d6; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 600; }
    .card h3 { font-size: 1.05rem; margin: 8px 0 6px; }
    .card p { color: #5c6b84; font-size: .9rem; margin: 0 0 8px; }
    .tech { font-size: .8rem; color: #8b97ad; }
    code { background: #f1f3f8; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Demo: dari Statis ke Dinamis</h1>
  <p class="note">
    Kartu project di bawah <b>TIDAK ditulis di HTML</b>. Mereka dibuat oleh JavaScript
    dari sebuah <b>data</b> (array <code>PROJECTS</code> di bawah). Inilah inti "dinamis":
    HTML kosong, isinya datang dari data. Nanti data ini tinggal diganti dari database (Supabase),
    kode render-nya sama persis.
  </p>

  <!-- HTML-nya kosong. JS yang mengisi. -->
  <div class="grid" id="projectGrid"></div>

  <script>
    // ====== DATA (nanti ini pindah ke tabel Supabase) ======
    const PROJECTS = [
      {
        title: "Web Profile Bootstrap",
        category: "Web",
        desc: "Web profile berbasis Bootstrap 5 untuk memenuhi tugas Desain Web.",
        tech: "Bootstrap 5, HTML, CSS, JavaScript",
        image: "images/portofolio_1.1.png"
      },
      {
        title: "Aplikasi Kontak (Java GUI)",
        category: "Java",
        desc: "Aplikasi Kontak berbasis Java GUI sederhana untuk memenuhi UAP Alpro.",
        tech: "Java",
        image: "images/portofolio_2.1.png"
      },
      {
        title: "Theater Sound Designer",
        category: "Music",
        desc: "Penata suara untuk kebutuhan Teater Drama Musikal.",
        tech: "FL Studio",
        image: "images/portofolio_3.png"
      }
    ];

    // ====== RENDER: ubah data jadi HTML ======
    function renderProjects(projects) {
      const grid = document.getElementById("projectGrid");
      grid.innerHTML = projects.map(p => `
        <div class="card">
          <img src="${p.image}" alt="${p.title}" onerror="this.style.visibility='hidden'">
          <div class="body">
            <span class="badge">${p.category}</span>
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
            <div class="tech">${p.tech}</div>
          </div>
        </div>
      `).join("");
    }

    // Sekarang: pakai data lokal.
    renderProjects(PROJECTS);

    // ====== NANTI (Supabase): tinggal ganti sumber datanya ======
    // const { data } = await supabase.from('projects').select('*');
    // renderProjects(data);
    // Perhatikan: fungsi renderProjects TIDAK berubah. Cuma sumber datanya.
  </script>
</body>
</html>
